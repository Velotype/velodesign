name: Auto-merge

# There is no second developer to review these, so the CI checks are the review. This turns on
# GitHub's own auto-merge, which holds the pull request until every required check on main's
# ruleset has passed and merges it only then - it does not bypass anything, and a failing check
# leaves the PR sitting open.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  enable:
    name: Enable auto-merge
    # Only for a pull request raised from a branch in this repository, never a fork - pushing a
    # branch here already requires write access, so that is the trust boundary. A fork's PR gets no
    # auto-merge and waits for a human, which is the point: "no review required" must not extend to
    # strangers.
    #
    # Checking `github.actor == github.repository_owner` looked like the tighter test and is wrong
    # here: this repository is owned by the Velotype *organisation*, so repository_owner is
    # "Velotype" while the actor is a user account. The job silently skipped on the first real PR.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Turn on auto-merge for this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      # GitHub merges the pull request itself once the checks pass, and a merge made that way does
      # not start pages.yml's `push` trigger (nor a `pull_request: closed` one) - so the site
      # stayed on its old build after every merge. Dispatching a workflow is the one thing the
      # workflow token may start, so this job waits for the merge and dispatches the deploy.
      # It gives up after 30 minutes; a pull request that is still open by then is a failing check
      # someone needs to look at anyway, and a later merge dispatches its own deploy.
      - name: Deploy Pages once it has merged
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for _ in $(seq 1 90); do
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            if [ "$state" = "MERGED" ]; then
              gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              exit 0
            fi
            sleep 20
          done
