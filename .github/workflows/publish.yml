name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 in October 2026, and a
    # publish job is the last place to find out the runner moved under you.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Fail here rather than halfway through a publish that cannot be undone - a JSR version is
      # immutable, so a bad one is permanent.
      - name: Verify the package builds and publishes cleanly
        run: deno publish --dry-run
      # TEMPORARY, for the first publish of the ./jsx-runtime export (0.1.1) only. deno.json's
      # jsxImportSource names this package's own ./jsx-runtime export, and JSR resolves that against
      # the registry, where 0.1.0 does not have it, so the publish fails with "export 'jsx-runtime'
      # not found". 0.1.0 used @velotype/velotype, so publish with that, which makes 0.1.1 the first
      # version that has the export. Remove this step before publishing 0.1.2.
      - name: Publish with Velotype as the JSX import source
        run: |
          sed -i 's#"jsxImportSource": "@velotype/velodesign"#"jsxImportSource": "@velotype/velotype"#' deno.json
          grep '"jsxImportSource"' deno.json
          npx jsr publish --allow-dirty
