name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 in October 2026, and a
    # publish job is the last place to find out the runner moved under you.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Fail here rather than halfway through a publish that cannot be undone - a JSR version is
      # immutable, so a bad one is permanent.
      - name: Verify the package builds and publishes cleanly
        run: deno publish --dry-run
      # JSR cannot publish with the jsxImportSource that deno.json sets. It names this package's own
      # ./jsx-runtime export, and JSR's server fails to build the module graph ("export 'jsx-runtime'
      # not found in jsr:@velotype/velodesign"). That happened for 0.1.1 and for 0.1.2, and the second
      # time the registry already had the export, so it is not a matter of publishing it first.
      # deno publish --dry-run resolves it locally and cannot catch this. 0.1.0 used
      # @velotype/velotype, and so does the published package, so publish with that.
      - name: Publish with Velotype as the JSX import source
        run: |
          sed -i 's#"jsxImportSource": "@velotype/velodesign"#"jsxImportSource": "@velotype/velotype"#' deno.json
          grep '"jsxImportSource"' deno.json
          npx jsr publish --allow-dirty
