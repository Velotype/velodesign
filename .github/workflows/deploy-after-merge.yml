name: Deploy after merge

# The auto-merge workflow merges pull requests as github-actions, and GitHub does not start a
# workflow from a push made with the workflow token - so pages.yml's `push` trigger never fires for
# those merges, and the site silently stayed on the old build. Dispatching a workflow is the one
# thing the token is allowed to start, so this watches for the merge and dispatches the deploy.
# A merge made by hand still triggers pages.yml's own push trigger as well; the two runs share its
# concurrency group, so the newer wins and nothing deploys twice.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: write

jobs:
  dispatch:
    name: Dispatch the Pages deploy
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Run pages.yml on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
