<body>
<div id="main-page"></div>
<!--
  The GitHub Pages counterpart to server.ts's `pageShell` - see the comment there for why the
  import map exists and why both velotype specifiers point at the same file. The one thing that
  differs is the base path: a GitHub Pages *project* site (as opposed to an org/user site) is
  served under its own repo name rather than the domain root, so every absolute path below is
  prefixed with "/velodesign" rather than "/". This file is deployed verbatim as both index.html
  and 404.html (the standard GitHub Pages SPA trick - a direct hit on a client-side route 404s at
  the real server, and GitHub serves this file's content for it without changing the browser's
  URL, so the client router below still sees the route it was actually asked for).

  "/velodesign" has to be kept in sync by hand in exactly two places if this repository is ever
  renamed or forked under another name: this prefix, and the inline script's own copy of it below
  (main.tsx reads the latter to configure History's client-side routing to match).
-->
<script type="importmap">{"imports": {
"@velotype/velotype": "/velodesign/build/velotype.js",
"@velotype/velotype/jsx-runtime": "/velodesign/build/velotype.js",
"@velotype/velodesign": "/velodesign/build/velodesign.js"
}}</script>
<!-- A classic (non-module) script, so it runs synchronously during parsing - before any of the
     deferred module scripts below, which is what main.tsx needs to find this already set. -->
<script>window.__VELODESIGN_BASE_PATH__ = "/velodesign"</script>
<script src="/velodesign/build/velotype.js" type="module"></script>
<script src="/velodesign/build/velodesign.js" type="module"></script>
<script src="/velodesign/build/main.js" type="module"></script>
</body>
</html>
